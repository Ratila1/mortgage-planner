plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.nosurprise'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // web + security
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Spring Boot 4: RestClient.Builder не приходит из webmvc-стартера, модуль нужен явно
    // (TwilioSmsSender/TelegramBotService собирают RestClient).
    implementation 'org.springframework.boot:spring-boot-restclient'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // messaging
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // storage
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // resilience4j circuit breaker
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'

    // libphonenumber for phone normalization
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.8'

    // Vonage SMS SDK
    implementation 'com.vonage:server-sdk:9.3.1'

    // tests
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// Обычный `gradle test` не требует Docker: integration-тесты (Testcontainers)
// помечены @Tag("integration") и исключены здесь.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Отдельный запуск integration-тестов: `gradle integrationTest` (нужен Docker).
tasks.register('integrationTest', Test) {
    description = 'Testcontainers integration tests (requires Docker)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
    maxParallelForks = 1
    systemProperty 'java.awt.headless', 'true'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// `gradle build`/`check` гоняет и integration-тесты (в CI есть Docker);
// локально без Docker проверять юниты: `gradle test`.
tasks.named('check') {
    dependsOn integrationTest
}