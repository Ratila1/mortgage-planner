spring:
  application:
    name: sms-verification-service
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: sched-
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nosurprise}
    username: ${DB_USER:nosurprise}
    password: ${DB_PASSWORD:nosurprise}
    hikari:
      schema: ${DB_SCHEMA:sms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      default_schema: ${DB_SCHEMA:sms}
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:sms}
    # Migrations are immutable: a checksum mismatch must fail, not be ignored.
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s

sms:
  cis-prefixes: ["+7","+375","+373","+374","+992","+993","+996","+998","+994","+380","+995"]
  max-attempts: 3
  first-backoff: ${SMS_FIRST_BACKOFF:15s}
  second-backoff: ${SMS_SECOND_BACKOFF:30s}
  # Single source of the code TTL: both SMS and Telegram channels read it.
  otp-ttl: 5m
  # Product rule (MICROLOANS.md 3.10, 4.4): 3 wrong attempts burn the code.
  max-verify-attempts: 3
  simulated-success-rate: 0.7
  dispatch-batch-size: 100
  lock-lease: 30s
  retention-request: 7d
  # Telegram outbox relay schedule (read by @Scheduled placeholders, not bound to SmsProperties).
  outbox-relay-interval: PT5S
  outbox-relay-initial-delay: PT2S
  rate-limit:
    phone-per-minute: 3

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: sms-verification-service

server:
  port: ${SERVER_PORT:8091}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:}
  sms:
    # Single provider switch: sim | vonage | twilio | log.
    provider: ${SMS_VERIFY_PROVIDER:sim}
    circuit-breaker:
      # Предохранитель перед транспортом. В стенде автотестов выключен: тесты намеренно
      # заваливают провайдера, открывают его на 30 секунд и роняют соседние тесты.
      enabled: ${SMS_CIRCUIT_BREAKER_ENABLED:true}
    vonage:
      api-key: ${VONAGE_API_KEY:}
      api-secret: ${VONAGE_API_SECRET:}
      from: ${VONAGE_FROM:Vonage APIs}
      timeout: ${VONAGE_TIMEOUT:PT10S}
    twilio:
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      api-key-sid: ${TWILIO_API_KEY_SID:}
      auth-secret: ${TWILIO_AUTH_SECRET:}
      from: ${TWILIO_FROM:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
      timeout: ${TWILIO_TIMEOUT:PT10S}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    webhook-path: /telegram/webhook
    api-base: ${TELEGRAM_API_BASE:https://api.telegram.org}
    # Local development only: polling deletes a configured webhook, so it is off by default.
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:false}
    timeout: ${TELEGRAM_TIMEOUT:PT5S}
    webhook-secret-token: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:}
  service:
    # No placeholder: an unset token makes the internal service token fail closed.
    token: ${SERVICE_TOKEN:}
  main-backend:
    base-url: ${MAIN_BACKEND_URL:http://backend:8080}
    timeout: ${MAIN_BACKEND_TIMEOUT:PT3S}
