global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Шаблон: docker-compose при старте подставляет METRICS_USER / METRICS_PASSWORD из .env
# (sed-замена в entrypoint), т.к. Prometheus не умеет env-подстановку в конфиге.
scrape_configs:
  - job_name: nosurprise-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
    basic_auth:
      username: METRICS_USER
      password: METRICS_PASSWORD
