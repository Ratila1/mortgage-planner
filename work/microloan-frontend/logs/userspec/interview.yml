# User-spec planning interview
# Questions and answers are preserved verbatim. Topic fields track what is known and still open.

interview_metadata:
  started: "2026-11-16 00:00:00"
  last_updated: "2026-11-16"
  status: "completed"
  can_resume: true

conversation_history:
  - questions: |
      1. Ок.
      2. Подходит.
      3. Да, все поля обязательны.
      4. Да, подходит. Достаточно статусов.
    answers: |
      Пользователь подтвердил один тип «Первый займ» с суммой 3 000–100 000 BYN, льготным периодом 7 дней под 0%, затем 0,8% в день. Расчёт — срок в днях, один платёж в конце, без капитализации: проценты начисляются на исходную сумму только за дни после льготного периода. Пример: 10 000 BYN на 10 дней — возврат 10 240 BYN.
      Первоначально пользователь согласовал обязательные ФИО, телефон, дату рождения, затем уточнил: ФИО, телефон и email обязательны, дата рождения не нужна. Паспортные поля не собираются. Шаг выбора файла обязателен, но только демонстрирует выбор: имя показывается до ухода со страницы, файл и имя не сохраняются. Пользователь указал, что версия предназначена разработчикам, предупреждения не нужны, интерфейс должен вести себя как production.
      Синтетические профили и демо-заявки, новые заявки и admin-статусы локальны для браузера и хранятся в localStorage. Администратор может просматривать пользователей/заявки, менять статус заявки и управлять типом займа (создать, редактировать, деактивировать). Общей синхронизации, реальных писем и удаления заявок/пользователей не требуется.
      Пользователь подтвердил статусы «Новая», «На рассмотрении», «Одобрена», «Отклонена» и возможность менять статус на любой из них. Новую заявку разрешено подать после отклонения предыдущей; пока она на рассмотрении или одобрена — нельзя.
      Пользователь согласовал срок 1–30 целых дней, округление результата до целого BYN обычным математическим способом, и поля типа займа: название, минимальная/максимальная сумма, длительность льготного периода, дневная ставка; суммы должны быть положительны, минимум не больше максимума, новый тип активен сразу.
  - questions: |
      1. **Данные заявки.** ФИО, телефон и дата рождения будут храниться в `localStorage`, как и другие данные демо, но браузерное хранилище не защищено. Рекомендую явно предупредить на форме и просить вводить только вымышленные тестовые данные. Интерфейс не сможет надёжно отличить вымышленные сведения от настоящих. Подходит?
      2. **Статусы и повторные заявки.** Предлагаю статусы «Новая», «На рассмотрении», «Одобрена», «Отклонена»; администратор может менять статус на любой из них. Пользователь сможет подать новую заявку, если предыдущая отклонена, но не пока по ней идёт рассмотрение или она одобрена. Подходит, или повторная заявка должна быть доступна всегда?
      3. **Срок и округление.** Для срока рекомендую диапазон 1–30 дней с шагом в один день. Расчётную сумму округлять до целого BYN обычным математическим округлением; за срок до 7 дней проценты равны нулю. Подходит?
      4. **Поля типа займа в админке.** Предлагаю разрешить задавать название, минимальную и максимальную сумму, длительность льготного периода, дневную ставку. Проверять положительные суммы и минимум не выше максимума; созданный тип сразу становится доступным. Подходит?
    answers: |
      1. «ФИО, телефон, email. Дата рождения не нужна. Это тестовая версия для разработчиков - предупреждения не нужны - все должно быть как в проде».
      2. «Подходит».
      3. «Да».
      4. «Да».
  - questions: |
      1. Подтверждаете, что тестовая версия может сохранять введённые ФИО и телефон локально в этом браузере без предупреждения, даже если разработчик введёт реальные данные? Либо запретить ввод реальных данных технически — например, оставить только синтетические профили и тестовые значения?
      2. Email заявки брать из email аккаунта пользователя, которым он вошёл, или просить ввести email отдельно в форме заявки? Предлагаю использовать адрес аккаунта, чтобы не дублировать поле.
      3. Для новых типов займа предлагаю проверять льготный период как целое число от 0 до 30 дней, а дневную ставку — как конечное число от 0% и выше. При недопустимых значениях тип не сохраняется. Подходит?
    answers: |
      1. «Все ок» — пользователь принимает локальное сохранение вводимых ФИО и телефона в тестовом приложении без предупреждения, в том числе если будут введены реальные данные.
      3. «Да» — пользователь согласовал проверку льготного периода как целого числа от 0 до 30 дней и дневной ставки как конечного числа от 0% и выше; невалидный тип не сохраняется.
      По email: «добавить обязательное поле email в форму заявки».
  - questions: |
      Если администратор отключит все типы, предлагаю показывать в калькуляторе сообщение «Сейчас нет доступных займов», скрывать расчёт и кнопку подачи заявки до активации типа. Подходит?
    answers: |
      «Да».
  - questions: |
      1. Существующий локальный mock-вход работает только при `VITE_USE_MOCKS=true`; иначе frontend использует backend API. Предлагаю считать включённый mock-режим обязательной конфигурацией этого внутреннего демо, не добавляя отдельный механизм входа и не меняя backend. Подходит?
      2. Если запись статуса заявки или типа займа в localStorage не удалась, предлагаю показать ошибку, не подтверждать изменение как сохранённое и вернуть интерфейс к фактически сохранённым данным. Подходит?
      3. Добавить в проверку, что административные экраны недоступны без входа и пользователям без роли admin?
    answers: |
      1. «Да».
      2. «Да».
      3. «Ок».
  - questions: |
      После деактивации всех типов калькулятор показывает empty state. Предлагаю разрешить администратору повторно активировать существующий деактивированный тип, чтобы восстановить доступность расчёта и заявки. Подходит?
    answers: |
      «Одобряю разрешить администратору повторно активировать существующий тип».
