user_experience:
  user_stories:
    score: 100
    value: "Посетитель выбирает сумму и срок в калькуляторе, затем после демо-входа заполняет обязательные ФИО, телефон и email в форме заявки. Пользователь обязательно выбирает файл как временную имитацию, отправляет заявку и видит её статус. Администратор видит тестовые профили/заявки, меняет статус заявки и управляет типом займа."
    gaps: []
    required: true
  edge_cases:
    score: 95
    value: "Единственный seed-тип: сумма 3 000–100 000 ₽; срок в днях, один платёж в конце. Изменённый админом тип должен использоваться калькулятором после сохранения; деактивация исключает тип из новых расчётов/заявок, не должна удалять историю. Если активных типов нет, показать «Сейчас нет доступных займов», скрыть расчёт и подачу заявки до активации типа. Файл обязателен к выбору, но не сохраняется и не передаётся."
    gaps: []
    required: true
  error_scenarios:
    score: 90
    value: "Обязательные поля и ограничения займа валидируются до продолжения/отправки; невозможность записать localStorage не должна показываться как успешная отправка. API-запросы за микрозаймом отсутствуют. Нельзя повторно отправить одну заявку из-за двойного клика/повторного submit."
    gaps: []
    required: true
  verification_strategy:
    score: 95
    value: "Проверить расчёт минимум на сроке до/на границе/после льготного периода и на примере 10 000 ₽/10 дней = 10 240 ₽; убедиться, что валидные обязательные данные и выбор файла создают одну заявку, файл не сохраняется, пользователь видит статус, а повторная заявка блокируется до отклонения. Проверить административную смену статуса и CRUD типов, включая валидацию, влияние активных типов на калькулятор, недоступность admin-экранов без авторизации/роли и обработку ошибок localStorage без ложного подтверждения сохранения."
    gaps: []
    required: true
  ui_ux_requirements:
    score: 70
    value: "Использовать визуальный стиль и паттерны существующего ипотечного калькулятора и сайта."
    gaps: ["Уточнить размещение вкладок/страниц и интеграцию с существующим admin offers"]
    required: false
  risks:
    score: 95
    value: "localStorage в одном браузере не обеспечивает серверную защиту, контроль доступа, межустройственную синхронизацию или безопасное хранение ФИО/телефона/email; backend не имеет микрозаймных endpoints. Пользователь сознательно разрешил в тестовой версии хранить введённые данные локально без предупреждения, однако это остаётся ограничением, не эквивалентным production backend. Файл только выбирается в браузере и не передаётся/не сохраняется приложением."
    gaps: []
    required: true
  technical_decisions:
