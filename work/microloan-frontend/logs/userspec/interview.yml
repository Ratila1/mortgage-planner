notes: "Объём согласован как внутреннее frontend-only тестовое приложение для разработчиков без предупреждений. Допустимо сохранять введённые ФИО, телефон и email в localStorage текущего браузера, хотя это хранилище не эквивалентно production backend и не синхронизируется. Дата рождения и паспортные поля не собираются; обязательный выбор файла — только браузерная имитация без передачи/сохранения. Ставки ориентированы на страницы MoneyMan, формула сознательно упрощена для демо. Backend и его API не менять."
