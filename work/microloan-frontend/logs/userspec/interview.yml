    value: "Frontend React/Vite; новый функционал хранит отдельные mock-типы/заявки/профили в localStorage текущего браузера, не меняет backend API и использует локально описанную формулу. Seed-тип первого займа: 3 000–100 000 ₽, льготный период 7 дней под 0%, затем 0,8% в день."
    gaps: []
    required: false
  deploy_approach:
    score: 0
    value: ""
    gaps: ["Определить требуемые deployment/configuration изменения, если применимо"]
    required: false
