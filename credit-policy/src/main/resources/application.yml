spring:
  application:
    name: credit-policy
  threads:
    virtual:
      enabled: true
  datasource:
    # Своя база: правила, цели, чёрный список, журнал расчётов. В базу монолита сервис не ходит (CREDIT_POLICY.md §7).
    url: ${POLICY_DB_URL:jdbc:postgresql://localhost:5432/nosurprise_scoring}
    username: ${POLICY_DB_USER:nosurprise}
    password: ${POLICY_DB_PASSWORD:nosurprise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Результат публикуется с подтверждением брокера (waitForConfirmsOrDie), §7.2
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false   # исчерпание retry → DLQ
        retry:
          enabled: true
          max-retries: 2                  # 3 попытки всего, паузы 1с, 2с
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s

server:
  port: ${SERVER_PORT:8092}
  # Снаружи сервис доступен только через nginx по /credit-policy/ (CREDIT_POLICY.md §11).
  servlet:
    context-path: /credit-policy
  forward-headers-strategy: framework

app:
  policy:
    # Тот же секрет, что у монолита: админка ходит сюда с access-токеном монолита.
    jwt-secret: ${JWT_SECRET:}
    business-zone: Europe/Minsk

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
