plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.nosurprise'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // web + security
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // storage
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // messaging + mail
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // pdf
    implementation 'com.github.librepdf:openpdf:1.3.39'

    // metrics / observability
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // resilience4j for SMS client circuit breaker
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // tests
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Kotlin auto-tests (backend/src/test/kotlin): web UI, API, WireMock, Allure, DB checks
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib'
    testImplementation 'com.codeborne:selenide:7.9.3'
    testImplementation 'com.squareup.retrofit2:retrofit:2.11.0'
    testImplementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.wiremock:wiremock-standalone:3.10.0'
    testImplementation 'io.qameta.allure:allure-junit5:2.29.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.29.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '25'
        freeCompilerArgs += ['-java-parameters']
    }
}

// Обычный `gradle test` не требует Docker: integration-тесты (Testcontainers)
// помечены @Tag("integration") и исключены здесь.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'ui'
    }
}

// Отдельный запуск integration-тестов: `gradle integrationTest` (нужен Docker).
tasks.register('integrationTest', Test) {
    description = 'Testcontainers integration tests (requires Docker)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration', 'wiremock', 'wiremock'
    }
    shouldRunAfter tasks.named('test')
    maxParallelForks = 1
    systemProperty 'java.awt.headless', 'true'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.register('uiTest', Test) {
    description = 'Selenide web UI tests (requires running app on base.url)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ui'
    }
    systemProperty 'base.url', System.getProperty('base.url', 'http://localhost:8080')
    systemProperty 'headless', System.getProperty('headless', 'true')
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// `gradle build`/`check` гоняет и integration-тесты (в CI есть Docker);
// локально без Docker проверять юниты: `gradle test`.
tasks.named('check') {
    dependsOn integrationTest
}
