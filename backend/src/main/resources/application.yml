spring:
  application:
    name: nosurprise
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/nosurprise}
    username: ${POSTGRES_USER:nosurprise}
    password: ${POSTGRES_PASSWORD:nosurprise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nosurprise}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  forward-headers-strategy: framework   # https-ссылки за nginx/Cloudflare

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-ttl: 15m
    refresh-ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
