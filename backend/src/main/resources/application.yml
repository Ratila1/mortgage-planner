spring:
  application:
    name: nosurprise
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/nosurprise}
    username: ${POSTGRES_USER:nosurprise}
    password: ${POSTGRES_PASSWORD:nosurprise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/nosurprise}
    representation:
      uuid: standard   # Boot 4.1: было spring.mongodb.uuid-representation / spring.data.mongodb.uuid-representation (deprecated level=error) — оба игнорируются
  data:
    mongodb:
      representation:
        big-decimal: decimal128   # деньги в Mongo — Decimal128, не строка (§6.2)
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # локальный Redis без пароля — пусто; в compose задаётся env
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirms: correlated   # К4: издатель дожидается подтверждения доставки брокером
    publisher-returns: true          # К4: неразместимое сообщение возвращается (ReturnedMessage)
    template:
      mandatory: true                # К4: mandatory — без соответствующей очереди → return
    listener:
      simple:
        default-requeue-rejected: false   # исчерпание retry → reject → DLX → DLQ (§8)
        retry:
          enabled: true
          max-retries: 2                  # 3 попытки всего: 1 + 2 retry
          initial-interval: 1s             # паузы 1с, 2с, 4с (§8)
          multiplier: 2
          max-interval: 4s
  servlet:
    multipart:
      max-file-size: 5MB      # фото паспорта (MICROLOANS.md §3.11); nginx пропускает до 6m
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}           # локально Mailpit :1025
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}            # секреты только через env, в репозиторий не коммитить
    password: ${MAIL_PASSWORD:}

server:
  forward-headers-strategy: framework   # https-ссылки за nginx/Cloudflare

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${APP_MAIL_FROM:noreply@nosurprise.dev}
  ratelimit:
    calc:
      anonymous-per-minute: 30      # аноним: 30 запросов/мин на IP (§6.3)
      authenticated-per-minute: 120 # пользователь: 120 запросов/мин (§6.3)
      window: 60s
    auth:
      login-per-minute: 10          # защита от перебора паролей: по IP (§7)
      link-consume-per-minute: 10   # защита от спама обменом ссылок: по IP (§7)
      register-per-minute: 5        # защита от массовых регистраций и потока писем: по IP
      link-request-per-minute: 5    # защита от почтовой бомбардировки чужих адресов: по IP
      refresh-per-minute: 30        # защита от спама/абьюза ротации refresh: по IP
      logout-per-minute: 30         # защита от спама logout: по IP
      window: 60s
  jwt:
    secret: ${JWT_SECRET:}   # секрет только из env, без dev-дефолта (§7); fail-fast в JwtProperties
    access-ttl: 15m
    refresh-ttl: 30d
  outbox:                       # transactional outbox (MICROLOANS.md §4.8)
    poll-interval: 1s
    batch-size: 100
    max-attempts: 10
    retention: 7d               # отправленные события
    processed-retention: 30d    # отметки processed_events
  loan:                         # микрозаймы (MICROLOANS.md)
    offer-ttl-business-days: 5  # срок подписания одобренного предложения, пн–пт
    business-zone: Europe/Minsk
    debt-load-warning-percent: 50
    credit-history-reconcile-delay: 15m
  sms:
    provider: ${SMS_PROVIDER:log}   # log — код пишется в лог бэкенда; vonage или twilio — реальные SMS
    vonage:
      api-key: ${VONAGE_API_KEY:}
      api-secret: ${VONAGE_API_SECRET:}
      from: ${VONAGE_FROM:Vonage APIs}             # имя отправителя или номер без «+»
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      api-key-sid: ${TWILIO_API_KEY_SID:}            # пусто — вход по Account SID + Auth Token
      auth-secret: ${TWILIO_AUTH_SECRET:}            # Auth Token или секрет API-ключа
      from: ${TWILIO_FROM:}                          # номер Twilio в E.164, например +15017122661
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}   # вместо from, если используете Messaging Service
      timeout: 10s
  kyc:
    max-file-size: 5MB
    retention: 7d               # хранение фото после отказа, отмены или истечения
  metrics:
    user: ${METRICS_USER:}         # пусто = /actuator/prometheus закрыт совсем (§7)
    password: ${METRICS_PASSWORD:} # задать, если Prometheus скрейпит с basic-авторизацией

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
