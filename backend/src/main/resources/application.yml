server:
  port: 8080

spring:
  application:
    name: mortgage-service

  # PostgreSQL R2DBC
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/mortgage}
    username: ${DB_USER:mortgage}
    password: ${DB_PASSWORD:mortgage}
    pool:
      initial-size: 5
      max-size: 20

  # Flyway (uses JDBC URL)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${DB_URL_JDBC:jdbc:postgresql://localhost:5432/mortgage}
    user: ${DB_USER:mortgage}
    password: ${DB_PASSWORD:mortgage}

  # MongoDB Reactive
  data:
    mongodb:
      uri: ${MONGO_URL:mongodb://localhost:27017/mortgage}
      auto-index-creation: true
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      reactive:
        lettuce:
          pool:
            max-active: 20
            max-idle: 10
            min-idle: 2

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual

  # Mail (SMTP)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
          github:
            client-id: ${OAUTH2_GITHUB_CLIENT_ID:}
            client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

# App base URL for email links
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

# Rate limiting
ratelimit:
  calculator:
    requests-per-minute: 10

# PDF Export
pdf:
  export:
    queue: pdf.export.queue
    exchange: pdf.export.exchange
    routing-key: pdf.export
  storage:
    path: ${PDF_STORAGE_PATH:/app/pdf-exports}

# RabbitMQ queues/exchanges
rabbitmq:
  exchange:
    rate-changed: rate.changed.exchange
    pdf-export: pdf.export.exchange
    rate-changed-retry: rate.changed.retry.exchange
    pdf-export-retry: pdf.export.retry.exchange
  queue:
    rate-changed: rate.changed.queue
    pdf-export: pdf.export.queue
    rate-changed-dlq: rate.changed.dlq
    pdf-export-dlq: pdf.export.dlq
    rate-changed-retry: rate.changed.retry.queue
    pdf-export-retry: pdf.export.retry.queue
  routing-key:
    rate-changed: rate.changed
    pdf-export: pdf.export
    rate-changed-retry: rate.changed.retry
    pdf-export-retry: pdf.export.retry
  retry:
    max-attempts: 5
    base-delay-ms: 2000

# Actuator / Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.bank.mortgage: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"