spring:
  application:
    name: nosurprise
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/nosurprise}
    username: ${POSTGRES_USER:nosurprise}
    password: ${POSTGRES_PASSWORD:nosurprise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/nosurprise}
    uuid-representation: standard
  data:
    mongodb:
      representation:
        big-decimal: decimal128   # деньги в Mongo — Decimal128, не строка (§6.2)
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # локальный Redis без пароля — пусто; в compose задаётся env
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirms: correlated   # К4: издатель дожидается подтверждения доставки брокером
    publisher-returns: true          # К4: неразместимое сообщение возвращается (ReturnedMessage)
    template:
      mandatory: true                # К4: mandatory — без соответствующей очереди → return
    listener:
      simple:
        default-requeue-rejected: false   # исчерпание retry → reject → DLX → DLQ (§8)
        retry:
          enabled: true
          max-retries: 2                  # 3 попытки всего: 1 + 2 retry
          initial-interval: 1s             # паузы 1с, 2с, 4с (§8)
          multiplier: 2
          max-interval: 4s
  mail:
    host: ${MAIL_HOST:localhost}           # локально Mailpit :1025
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}            # секреты только через env, в репозиторий не коммитить
    password: ${MAIL_PASSWORD:}

server:
  forward-headers-strategy: framework   # https-ссылки за nginx/Cloudflare

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${APP_MAIL_FROM:noreply@nosurprise.dev}
  ratelimit:
    calc:
      anonymous-per-minute: 30      # аноним: 30 запросов/мин на IP (§6.3)
      authenticated-per-minute: 120 # пользователь: 120 запросов/мин (§6.3)
      window: 60s
    auth:
      login-per-minute: 10          # защита от перебора паролей: по IP (§7)
      otp-verify-per-minute: 10     # защита от подбора OTP: по IP (§7)
      register-per-minute: 5        # защита от массовых регистраций и потока писем: по IP
      otp-request-per-minute: 5     # защита от почтовой бомбардировки чужих адресов: по IP
      window: 60s
  jwt:
    secret: ${JWT_SECRET:}   # секрет только из env, без dev-дефолта (§7); fail-fast в JwtProperties
    access-ttl: 15m
    refresh-ttl: 30d
  metrics:
    user: ${METRICS_USER:}         # пусто = /actuator/prometheus закрыт совсем (§7)
    password: ${METRICS_PASSWORD:} # задать, если Prometheus скрейпит с basic-авторизацией

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
