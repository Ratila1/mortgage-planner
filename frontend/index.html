<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ООО «Тмыв денег» — честный калькулятор ипотеки: платёж, переплата, график и досрочные погашения." />
    <!-- color-scheme: до рендера сообщаем браузеру обе темы (см. dark-mode в modern-web-guidance). -->
    <meta name="color-scheme" content="light dark" />
    <!-- Инлайн (не module/defer): применяем сохранённый выбор темы до первой отрисовки, иначе вспышка светлой темы. -->
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem('color-scheme') ?? 'light dark';
      } catch {
        /* localStorage заблокирован — сайт просто следует системной теме */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Ипотека без сюрпризов — ООО «Тмыв денег»</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
