# Cloudflare шлёт X-Forwarded-Proto=https, пробрасываем его как есть
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(api|oauth2|login/oauth2)/ {
    proxy_pass http://backend:8080;
    # $http_host сохраняет порт (localhost:8080): иначе редиректы бэкенда после OAuth уйдут на localhost:80
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
