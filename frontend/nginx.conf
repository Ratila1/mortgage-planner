# Cloudflare шлёт X-Forwarded-Proto=https, пробрасываем его как есть
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Кредитное бюро (CREDIT_BUREAU.md §8, уровень 1): лимит по IP ещё до приложения — 10 запросов/с, всплеск 20.
limit_req_zone $binary_remote_addr zone=bureau:10m rate=10r/s;

server {
  listen 80;

  # DNS Docker. Upstream-ы необязательных сервисов (notification-service, credit-bureau) задаются переменной —
  # тогда nginx резолвит имя при запросе, а не при старте. Иначе, если такой контейнер упал или ещё не создан,
  # nginx не запускается целиком («host not found in upstream») и сайт недоступен.
  resolver 127.0.0.11 valid=10s ipv6=off;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

  # Фото паспорта до 5 МБ (MICROLOANS.md §3.11): по умолчанию nginx режет тело на 1 МБ и отвечает 413 до бэка.
  client_max_body_size 6m;

  location ~ ^/(api/verify|telegram)/ {
    set $notification_upstream http://notification-service:8090;
    proxy_pass $notification_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Кредитное бюро для банков-партнёров: API и Swagger UI (/bureau/swagger-ui.html).
  # ФИО и телефон идут в теле запроса — в access-лог не попадают: формат лога по умолчанию тела не содержит.
  location /bureau/ {
    limit_req zone=bureau burst=20 nodelay;
    limit_req_status 429;
    set $bureau_upstream http://credit-bureau:8091;
    proxy_pass $bureau_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location ~ ^/(api|oauth2|login/oauth2)/ {
    proxy_pass http://backend:8080;
    # $http_host сохраняет порт (localhost:8080): иначе редиректы бэкенда после OAuth уйдут на localhost:80
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
