# Cloudflare шлёт X-Forwarded-Proto=https, пробрасываем его как есть
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/html text/css text/plain text/javascript application/javascript application/json image/svg+xml;

  # Фото паспорта до 5 МБ (MICROLOANS.md §3.11): по умолчанию nginx режет тело на 1 МБ и отвечает 413 до бэка.
  client_max_body_size 6m;

  location ~ ^/(api/verify|telegram)/ {
    proxy_pass http://notification-service:8090;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location ~ ^/(api|oauth2|login/oauth2)/ {
    proxy_pass http://backend:8080;
    # $http_host сохраняет порт (localhost:8080): иначе редиректы бэкенда после OAuth уйдут на localhost:80
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}