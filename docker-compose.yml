name: nosurprise

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nosurprise}
      POSTGRES_USER: ${POSTGRES_USER:-nosurprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosurprise}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nosurprise}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nosurprise}
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-nosurprise}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nosurprise}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nosurprise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nosurprise}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:   # локальный SMTP + веб-интерфейс для писем подтверждения
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nosurprise}
      POSTGRES_USER: ${POSTGRES_USER:-nosurprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosurprise}
      MONGODB_URI: mongodb://${MONGO_USER:-nosurprise}:${MONGO_PASSWORD:-nosurprise}@mongo:27017/nosurprise?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nosurprise}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-nosurprise}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-nosurprise}
      MAIL_HOST: mailpit
      # Секрет строго обязателен (§7): без него контейнер не поднимется,
      # дефолт change-me убран — fail-fast в JwtProperties работает как задумано.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      METRICS_USER: ${METRICS_USER:-}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
    expose: ["8080"]   # наружу бэк не торчит, вход только через frontend (nginx)

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]   # единая точка входа: фронт + /api + /oauth2

  cloudflared:   # docker compose --profile tunnel up
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on: [frontend]

volumes:
  pgdata:
  mongodata:
  redisdata:
