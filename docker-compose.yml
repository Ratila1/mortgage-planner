name: nosurprise

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nosurprise}
      POSTGRES_USER: ${POSTGRES_USER:-nosurprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosurprise}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:   # локальный SMTP + веб-интерфейс для писем подтверждения: http://localhost:8025
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_DISABLE_RDNS: "true"   # без reverse DNS письма уходят сразу, а не через ~10 с
    ports: ["1025:1025", "8025:8025"]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nosurprise}
      POSTGRES_USER: ${POSTGRES_USER:-nosurprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosurprise}
      MONGODB_URI: mongodb://mongo:27017/nosurprise
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MAIL_HOST: mailpit
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      # Первый ADMIN создаётся при старте (FirstAdminBootstrap). Для демо есть значения по умолчанию.
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@nosurprise.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin12345}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    expose: ["8080"]   # наружу бэк не торчит, вход только через frontend (nginx)
    healthcheck:       # порт открывается только после полного старта Spring-контекста
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: ["8080:80"]   # единая точка входа: фронт + /api + /oauth2

  cloudflared:   # docker compose --profile tunnel up
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on: [frontend]

volumes:
  pgdata:
  mongodata:
