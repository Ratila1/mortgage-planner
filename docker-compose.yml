name: nosurprise

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nosurprise}
      POSTGRES_USER: ${POSTGRES_USER:-nosurprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosurprise}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:   # локальный SMTP + веб-интерфейс для писем подтверждения: http://localhost:8025
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_DISABLE_RDNS: "true"   # без reverse DNS письма уходят сразу, а не через ~10 с
    ports: ["1025:1025", "8025:8025"]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      sms-verification-service: { condition: service_healthy }
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nosurprise}
      POSTGRES_USER: ${POSTGRES_USER:-nosurprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosurprise}
      MONGODB_URI: mongodb://mongo:27017/nosurprise
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MAIL_HOST: mailpit
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@nosurprise.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin12345}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      METRICS_USER: ${METRICS_USER:-prometheus}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-prometheus}
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SMS_CLIENT_BASE_URL: http://sms-verification-service:8091
      SMS_CLIENT_SERVICE_JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?}
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  sms-verification-service:
    build: ./sms-verification-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${SMS_PROFILE:-sim}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nosurprise}
      DB_SCHEMA: sms
      DB_USER: ${POSTGRES_USER:-nosurprise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nosurprise}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?}
      SMS_VERIFY_PROVIDER: ${SMS_VERIFY_PROVIDER:-sim}
      VONAGE_API_KEY: ${VONAGE_API_KEY:-}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET:-}
      VONAGE_FROM: ${VONAGE_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_SECRET: ${TWILIO_AUTH_SECRET:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?}
      MAIN_BACKEND_URL: http://backend:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:-}
    expose: ["8091"]
    healthcheck:
      # Readiness, not just an open port: the container is healthy only when the app is ready.
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/8091 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s

      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
      sms-verification-service: { condition: service_healthy }
    ports: ["8080:80"]

  cloudflared:   # docker compose --profile tunnel up
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on: [frontend]

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      backend: { condition: service_healthy }
      sms-verification-service: { condition: service_healthy }
    environment:
      METRICS_USER: ${METRICS_USER:-prometheus}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-prometheus}
    volumes:
      # В git лежит только шаблон; конфиг с паролем собирается при старте (в образе нет envsubst).
      - ./monitoring/prometheus/prometheus.template.yml:/etc/prometheus/prometheus.template.yml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|METRICS_USER|$${METRICS_USER}|g" -e "s|METRICS_PASSWORD|$${METRICS_PASSWORD}|g" \
          /etc/prometheus/prometheus.template.yml > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports: ["3000:3000"]

volumes:
  pgdata:
  mongodata: