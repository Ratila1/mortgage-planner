spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/nosurprise_notifications}
    username: ${POSTGRES_USER:nosurprise}
    password: ${POSTGRES_PASSWORD:nosurprise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s

server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:}          # общий с основным бэкендом (HS256)
    access-ttl: 15m
  service:
    token: ${SERVICE_TOKEN:}       # для вызовов основного бэкенда /api/internal/**
  main-backend:
    base-url: ${MAIN_BACKEND_URL:http://localhost:8080}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    webhook-path: /telegram/webhook
    api-base: https://api.telegram.org
  verification:
    code-ttl: 5m
    max-attempts: 3
    cooldown: 60s
  rate-limit:
    telegram-send-per-second: 25

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus